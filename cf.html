<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><meta name="description" content="次元星域 · 网络节点与延迟监测"><title>次元星域 · 优选域名</title><link rel="dns-prefetch" href="//fontsapi.zeoseven.com"><link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin><link rel="preconnect" href="https://t.alcy.cc"><link rel="dns-prefetch" href="//www.google.com"><link rel="dns-prefetch" href="//icons.duckduckgo.com"><link rel="preload" as="style" href="https://fontsapi.zeoseven.com/521/main/result.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/521/main/result.css"></noscript><style>:root{--wallpaper:url("https://t.alcy.cc/ycy");--text:#263244;--muted:#8792a3;--green:#16a477;--yellow:#e7b43d;--red:#e45b5b;--glass:rgba(255,255,255,.76);--border:rgba(255,255,255,.8)}@media(orientation:portrait){:root{--wallpaper:url("https://t.alcy.cc/mp")}}*{box-sizing:border-box}html{min-height:100%;background:#f5f7fa}body{margin:0;min-height:100vh;color:var(--text);font-family:"JetBrains Maple Mono",ui-monospace,monospace}body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none}body:before{z-index:-2;background:var(--wallpaper) center/cover no-repeat;transform:scale(1.01)}body:after{z-index:-1;background:rgba(246,249,253,.48)}.shell{width:min(1080px,100%);margin:auto;padding:38px 24px 26px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{min-width:0}.brand h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-1.5px}.brand p{margin:8px 0 0;color:var(--muted);font-size:12px;letter-spacing:.5px}.host{max-width:42%;padding:9px 14px;border:1px solid var(--border);border-radius:30px;background:rgba(255,255,255,.65);color:#6f7b8d;font-size:11px;overflow-wrap:anywhere;text-align:center}.card{min-width:0;padding:20px;border:1px solid var(--border);border-radius:19px;background:var(--glass);box-shadow:0 8px 32px rgba(43,61,87,.055);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.top-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch;margin-bottom:14px}.overview-card,.trend-card{width:100%;min-width:0;margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 18px}.stat{min-width:0;padding-right:6px;border-right:1px solid rgba(111,126,148,.16)}.stat:last-child{padding-right:0;border:0}.stat-label{color:var(--muted);font-size:clamp(8px,.85vw,11px);white-space:nowrap}.stat-value{margin-top:9px;font-size:clamp(12px,1.5vw,21px);font-weight:650;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-value small{margin-left:2px;color:var(--muted);font-size:clamp(8px,.8vw,11px);font-weight:400}.stat-sub{margin-top:6px;color:var(--muted);font-size:clamp(7px,.72vw,10px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.overview-divider{height:1px;margin-bottom:16px;background:rgba(111,126,148,.16)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:9px;min-width:0;margin-bottom:15px}.section-title h2{margin:0;font-size:14px;font-weight:650}.section-title span{color:var(--muted);font-size:9px;white-space:nowrap}.network-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.info-item{min-width:0}.info-label{margin-bottom:7px;color:var(--muted);font-size:10px}.info-value{font-size:clamp(9px,.95vw,12px);font-weight:600;overflow-wrap:anywhere}.trend-card{display:flex;flex-direction:column;overflow:hidden}.trend-card .section-title{align-items:flex-start;flex-wrap:wrap}.legend{display:flex;align-items:center;flex-wrap:wrap;gap:9px;min-width:0;color:var(--muted);font-size:9px}.legend-item{display:flex;align-items:center;gap:4px;white-space:nowrap}.legend-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%}#history{width:100%;min-width:0;height:290px;overflow:hidden}#history svg{display:block;width:100%;height:100%;overflow:hidden}.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.node-list{display:flex;flex-direction:column;gap:4px}.node-row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(90px,.8fr) 58px;align-items:center;gap:10px;min-height:47px;padding:7px 9px;border-radius:11px}.node-row:hover{background:rgba(255,255,255,.55)}.node-icon{width:25px;height:25px;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.8)}.node-icon img{width:19px;height:19px;object-fit:contain}.node-fallback{display:none;width:100%;height:100%;place-items:center;color:#78869b;font-size:12px;font-weight:700}.node-info{min-width:0}.node-name,.node-host{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-name{font-size:11px;font-weight:600}.node-host{margin-top:3px;color:var(--muted);font-size:9px}.history-bars{height:24px;display:flex;align-items:flex-end;justify-content:flex-end;gap:2px;overflow:hidden}.history-bars i{display:block;flex:1;min-width:2px;max-width:5px;min-height:3px;border-radius:5px;background:#d7dee8}.history-bars i.good{background:var(--green)}.history-bars i.warn{background:var(--yellow)}.history-bars i.bad{background:var(--red)}.latency{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}.latency.good{color:var(--green)}.latency.warn{color:#c49325}.latency.bad{color:var(--red)}.latency.pending{color:var(--muted)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:0 3px;color:var(--muted);font-size:10px}footer a{color:inherit;text-decoration:none}@media(max-width:820px){.shell{padding:26px 15px 20px}.top-grid,.dashboard-grid{grid-template-columns:minmax(0,1fr)}.stats{gap:12px}.stat-label{font-size:10px}.stat-value{font-size:clamp(19px,4vw,25px)}.stat-value small{font-size:11px}.stat-sub{font-size:9px}.info-value{font-size:12px}#history{height:260px}}@media(max-width:420px){header{align-items:flex-start}.host{max-width:38%;font-size:9px}.card{padding:17px}.node-row{grid-template-columns:27px minmax(0,1fr) minmax(65px,.7fr) 52px;gap:7px;padding-inline:5px}.network-grid{gap:16px 9px}.info-value{font-size:11px}.legend{gap:8px}#history{height:230px}}</style></head><body><div class="shell"><header><div class="brand"><h1>次元星域</h1><p>优选域名 · NETWORK MONITOR</p></div><div class="host" id="host">...</div></header><div class="top-grid"><section class="card overview-card"><div class="stats"><div class="stat"><div class="stat-label">平均延迟</div><div class="stat-value" id="avg">—<small>ms</small></div><div class="stat-sub" id="avg-sub">等待检测</div></div><div class="stat"><div class="stat-label">最低延迟</div><div class="stat-value" id="min">—<small>ms</small></div><div class="stat-sub" id="fastest">—</div></div><div class="stat"><div class="stat-label">最高延迟</div><div class="stat-value" id="max">—<small>ms</small></div><div class="stat-sub" id="slowest">—</div></div><div class="stat"><div class="stat-label">请求失败率</div><div class="stat-value" id="loss">—<small>%</small></div><div class="stat-sub">不可达占比</div></div></div><div class="overview-divider"></div><div class="section-title"><h2>连接信息</h2><span>CLOUDFLARE NETWORK</span></div><div class="network-grid"><div class="info-item"><div class="info-label">客户端 IP</div><div class="info-value" id="ip">获取中</div></div><div class="info-item"><div class="info-label">国家 / 地区</div><div class="info-value" id="country">—</div></div><div class="info-item"><div class="info-label">Cloudflare 节点</div><div class="info-value" id="colo">—</div></div><div class="info-item"><div class="info-label">ASN</div><div class="info-value" id="asn">—</div></div><div class="info-item"><div class="info-label">网络运营商</div><div class="info-value" id="org">—</div></div><div class="info-item"><div class="info-label">城市 / 区域</div><div class="info-value" id="location">—</div></div></div></section><section class="card trend-card"><div class="section-title"><h2>网络延迟趋势</h2><div class="legend"><span class="legend-item"><i class="legend-dot" style="background:#16a477"></i>≤100ms</span><span class="legend-item"><i class="legend-dot" style="background:#e7b43d"></i>100–300ms</span><span class="legend-item"><i class="legend-dot" style="background:#e45b5b"></i>＞300ms</span></div></div><div id="history"></div></section></div><div class="dashboard-grid"><section class="card"><div class="section-title"><h2>国内节点</h2></div><div class="node-list" id="cn-nodes"></div></section><section class="card"><div class="section-title"><h2>全球节点</h2></div><div class="node-list" id="global-nodes"></div></section></div><footer><span>UPDATED <span id="updated">—</span></span><a href="https://cf.107211.xyz/" target="_blank" rel="noopener noreferrer">次元星域</a></footer></div><script>
(()=>{
const $=id=>document.getElementById(id);
const PROBE=1000,TREND_INTERVAL=1000,META=1000,TIMEOUT=900,HISTORY=20,TREND_LIMIT=30;
const groups={
 cn:[
  {id:'baidu',name:'百度',host:'www.baidu.com'},
  {id:'qq',name:'腾讯',host:'www.qq.com'},
  {id:'bilibili',name:'哔哩哔哩',host:'www.bilibili.com'},
  {id:'bytedance',name:'字节跳动',host:'www.bytedance.com'},
  {id:'taobao',name:'淘宝',host:'www.taobao.com'},
  {id:'netease',name:'网易云音乐',host:'music.163.com'},
  {id:'jd',name:'京东',host:'www.jd.com'}
 ],
 global:[
  {id:'cloudflare',name:'Cloudflare',host:'www.cloudflare.com'},
  {id:'google',name:'Google',host:'www.google.com'},
  {id:'github',name:'GitHub',host:'github.com'},
  {id:'jsdelivr',name:'jsDelivr',host:'cdn.jsdelivr.net'},
  {id:'youtube',name:'YouTube',host:'www.youtube.com'},
  {id:'x',name:'X',host:'x.com'},
  {id:'wikipedia',name:'Wikipedia',host:'www.wikipedia.org'}
 ]
};
const nodes=[...groups.cn,...groups.global];
const histories=Object.fromEntries(nodes.map(n=>[n.id,[]]));
const trend=[];
let busy=false,metaBusy=false,latestAvg=null;
function nodeHTML(n){
 return '<div class="node-row"><div class="node-icon"><img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(n.host)+'&sz=64" data-host="'+n.host+'" alt="" loading="lazy" decoding="async"><span class="node-fallback">'+n.name[0]+'</span></div><div class="node-info"><span class="node-name">'+n.name+'</span><span class="node-host">'+n.host+'</span></div><div class="history-bars" id="bars-'+n.id+'"></div><div class="latency pending" id="latency-'+n.id+'">—</div></div>';
}
function drawNodes(){
 $('cn-nodes').innerHTML=groups.cn.map(nodeHTML).join('');
 $('global-nodes').innerHTML=groups.global.map(nodeHTML).join('');
 document.querySelectorAll('.node-icon img').forEach(img=>img.onerror=()=>{
  if(!img.dataset.fallback){img.dataset.fallback='1';img.src='https://icons.duckduckgo.com/ip3/'+img.dataset.host+'.ico';return}
  img.style.display='none';img.nextElementSibling.style.display='grid';
 });
}
function renderHistory(id){
 const el=$('bars-'+id);
 el.innerHTML=histories[id].map(r=>{
  if(!r.ok)return '<i class="bad" style="height:4px" title="检测失败"></i>';
  const color=r.ms<=100?'good':r.ms<=300?'warn':'bad';
  return '<i class="'+color+'" style="height:'+Math.max(12,Math.min(100,r.ms/3))+'%" title="'+r.ms+' ms"></i>';
 }).join('');
}
function updateNodes(results){
 results.forEach(r=>{
  const h=histories[r.id];h.push(r);if(h.length>HISTORY)h.shift();
  const el=$('latency-'+r.id);
  el.className='latency';
  el.textContent=r.ok?r.ms+' ms':'超时';
  el.classList.add(r.ok?(r.ms<=100?'good':r.ms<=300?'warn':'bad'):'bad');
  renderHistory(r.id);
 });
}
async function probe(n){
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),TIMEOUT),start=performance.now();
 try{
  await fetch('https://'+n.host+'/favicon.ico?t='+Date.now(),{mode:'no-cors',cache:'no-store',signal:c.signal});
  return {id:n.id,ok:true,ms:Math.max(1,Math.round(performance.now()-start))};
 }catch(e){return {id:n.id,ok:false,ms:null}}
 finally{clearTimeout(timer)}
}
function summary(results){
 const valid=results.filter(r=>r.ok),failed=results.length-valid.length;
 const avg=valid.length?Math.round(valid.reduce((s,r)=>s+r.ms,0)/valid.length):null;
 const min=valid.length?Math.min(...valid.map(r=>r.ms)):null;
 const max=valid.length?Math.max(...valid.map(r=>r.ms)):null;
 const fast=valid.length?valid.reduce((a,b)=>a.ms<=b.ms?a:b):null;
 const slow=valid.length?valid.reduce((a,b)=>a.ms>=b.ms?a:b):null;
 latestAvg=avg;
 $('avg').innerHTML=avg===null?'—<small>ms</small>':avg+'<small>ms</small>';
 $('min').innerHTML=min===null?'—<small>ms</small>':min+'<small>ms</small>';
 $('max').innerHTML=max===null?'—<small>ms</small>':max+'<small>ms</small>';
 $('loss').innerHTML=Math.round(failed/results.length*100)+'<small>%</small>';
 $('avg-sub').textContent=valid.length+'/'+results.length+' 可达';
 $('fastest').textContent=fast?nodes.find(n=>n.id===fast.id).name:'—';
 $('slowest').textContent=slow?nodes.find(n=>n.id===slow.id).name:'—';
}
function renderTrend(){
 const W=600,H=250,L=44,R=10,T=14,B=14,base=H-B,plotH=base-T,plotW=W-L-R;
 const values=trend.slice(-TREND_LIMIT),valid=values.filter(Number.isFinite);
 const maxValue=valid.length?Math.max(...valid):0,target=Math.max(100,maxValue*1.1);
 const mag=Math.pow(10,Math.floor(Math.log10(target/2||1)));
 const ratio=target/2/mag,stepSize=[1,1.5,2,2.5,5,10].find(n=>n>=ratio)*mag;
 const scale=Math.max(100,Math.ceil(target/stepSize)*stepSize);
 const slot=plotW/TREND_LIMIT,barW=slot*.9,offset=TREND_LIMIT-values.length;
 let grid='',guides='';
 for(let v=stepSize;v<=scale+1e-9;v+=stepSize){
  const y=base-v/scale*plotH;
  grid+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(111,126,148,.17)"/><text x="'+(L-8)+'" y="'+(y+3)+'" text-anchor="end" fill="#8b96a6" font-size="9">'+v+'</text>';
 }
 [100,300].forEach(v=>{
  if(v<scale&&Math.abs(v/stepSize-Math.round(v/stepSize))>1e-8){
   const y=base-v/scale*plotH;
   guides+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(160,170,184,.35)" stroke-dasharray="3 4"/>';
  }
 });
 const bars=values.map((v,i)=>{
  const x=L+(offset+i)*slot+(slot-barW)/2,ok=Number.isFinite(v);
  const h=ok?Math.max(3,v/scale*plotH):3,y=base-h;
  const color=!ok?'#cbd3df':v<=100?'#16a477':v<=300?'#e7b43d':'#e45b5b',radius=Math.min(barW/2,h/2);
  return '<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+barW.toFixed(2)+'" height="'+h.toFixed(2)+'" rx="'+radius.toFixed(2)+'" ry="'+radius.toFixed(2)+'" fill="'+color+'"><title>'+(ok?v+' ms':'暂无数据')+'</title></rect>';
 }).join('');
 $('history').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="网络延迟趋势图"><text x="4" y="12" fill="#8b96a6" font-size="9">ms</text>'+grid+guides+bars+'</svg>';
}
function sampleTrend(){
 trend.push(latestAvg);if(trend.length>TREND_LIMIT)trend.shift();renderTrend();
}
async function refresh(){
 if(busy)return;busy=true;
 try{
  const results=await Promise.all(nodes.map(probe));
  updateNodes(results);summary(results);
  $('updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
 }finally{busy=false}
}
function normalizeKey(key){return String(key).toLowerCase().replace(/[^a-z0-9]/g,'')}
function parseMetaText(text){
 const value=text.trim();
 if(!value)return {};
 try{return JSON.parse(value)}catch{}
 const result={};
 value.split(/[\r\n;]+/).forEach(line=>{
  const i=line.indexOf('=')>=0?line.indexOf('='):line.indexOf(':');
  if(i>0)result[line.slice(0,i).trim()]=line.slice(i+1).trim();
 });
 if(!Object.keys(result).length&&/^(?:\d{1,3}\.){3}\d{1,3}$/.test(value))result.ip=value;
 return result;
}
function readMetaField(data,aliases){
 const wanted=new Set(aliases.map(normalizeKey));
 function walk(value,depth){
  if(!value||typeof value!=='object'||depth>6)return undefined;
  for(const [key,item] of Object.entries(value)){
   if(wanted.has(normalizeKey(key))&&item!==null&&item!==undefined&&item!=='')return item;
  }
  for(const item of Object.values(value)){
   const found=walk(item,depth+1);
   if(found!==undefined)return found;
  }
 }
 return walk(data,0);
}
function metaText(value){
 if(value===null||value===undefined)return '';
 if(typeof value==='object')return String(value.name??value.label??value.value??value.code??'');
 return String(value).trim();
}
async function meta(){
 if(metaBusy)return;
 metaBusy=true;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);
 try{
  // 不添加 Cache-Control / Pragma 自定义请求头，避免触发跨域预检 OPTIONS。
  const endpoint='https://ip.107211.xyz/ip?_='+Date.now();
  const r=await fetch(endpoint,{method:'GET',mode:'cors',cache:'no-store',headers:{Accept:'application/json, text/plain, */*'},signal:controller.signal});
  if(!r.ok)throw Error('HTTP '+r.status);
  const raw=await r.text();
  const data=parseMetaText(raw);
  const ip=metaText(readMetaField(data,['ip','clientIp','client_ip','ipAddress','ip_address','query','remoteAddr','remote_ip','address']));
  const country=metaText(readMetaField(data,['country','countryName','country_name','countryCode','country_code']));
  const colo=metaText(readMetaField(data,['colo','cfColo','cf_colo','cloudflareColo','cloudflare_colo','edgeColo','edge_colo']));
  const asnRaw=metaText(readMetaField(data,['asn','asNumber','as_number','asnum','as_num','autonomousSystemNumber']));
  const org=metaText(readMetaField(data,['asOrganization','as_organization','asOrganizationName','organization','organisation','org','isp','provider','asName','as_name']));
  const city=metaText(readMetaField(data,['city','town','locality']));
  const region=metaText(readMetaField(data,['region','regionName','region_name','state','province','subdivision']));
  $('ip').textContent=ip||'—';
  $('country').textContent=country||'—';
  $('colo').textContent=colo||'—';
  $('asn').textContent=asnRaw?( /^AS/i.test(asnRaw)?asnRaw:'AS'+asnRaw):'—';
  $('org').textContent=org||'—';
  $('location').textContent=[city,region].filter(Boolean).join(', ')||'—';
  if(!ip&&!country&&!colo&&!asnRaw&&!org&&!city&&!region){
   console.warn('IP API returned data, but no recognized fields were found:',data);
   $('ip').textContent='参数格式不匹配';
  }
 }catch(e){
  console.warn('IP metadata refresh failed:',e);
  $('ip').textContent=e.name==='AbortError'?'请求超时':'获取失败';
  $('ip').title=String(e.message||e);
 }finally{
  clearTimeout(timer);
  metaBusy=false;
 }
}

$('host').textContent=location.host||'LOCAL HTML';
drawNodes();renderTrend();refresh();sampleTrend();meta();
setInterval(refresh,PROBE);setInterval(sampleTrend,TREND_INTERVAL);setInterval(meta,META);
})();
</script></body></html>
