t-size:11px}.info-value{font-size:12px}.legend{gap:5px}.monitor{padding:10px}.monitor-grid{grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px}.site{padding:8px}}@media(prefers-reduced-motion:reduce){.site,.bars i,.digit-strip{transition:none}}footer{display:flex;justify-content:space-between;gap:12px;margin-top:16px;padding:0 3px;color:var(--muted);font-size:10px}footer a{color:inherit;text-decoration:none}</style></head><body><main class="shell"><header><div class="brand"><h1>次元星域</h1><p>优选域名 · NETWORK MONITOR</p></div><div class="host" id="host">正在读取地址…</div></header><div class="top-grid"><section class="card overview-card" aria-labelledby="connection-title"><div class="section-title"><h2 id="connection-title">连接信息</h2></div><div class="network-grid"><div class="info-item"><div class="info-label">客户端 IP</div><div class="info-value" id="ip">获取中</div></div><div class="info-item"><div class="info-label">国家 / 地区</div><div class="info-value" id="country">—</div></div><div class="info-item"><div class="info-label">Cloudflare 节点</div><div class="info-value" id="colo">—</div></div><div class="info-item"><div class="info-label">ASN</div><div class="info-value" id="asn">—</div></div><div class="info-item"><div class="info-label">网络运营商</div><div class="info-value" id="org">—</div></div><div class="info-item"><div class="info-label">城市 / 区域</div><div class="info-value" id="location">—</div></div></div></section><section class="card trend-card" id="trend-card" aria-labelledby="trend-title"><div class="section-title"><div class="trend-heading"><h2 id="trend-title">网络延迟趋势</h2><span class="trend-average">平均延迟：<span id="avg">—</span></span></div><div class="legend" aria-label="延迟等级图例"><span class="legend-item"><i class="legend-dot" style="background:#16a477"></i>≤100ms</span><span class="legend-item"><i class="legend-dot" style="background:#e7b43d"></i>100–300ms</span><span class="legend-item"><i class="legend-dot" style="background:#e45b5b"></i>＞300ms</span></div></div><div class="view-stage"><div id="history"></div></div></section></div><section class="card monitor" aria-labelledby="monitor-title"><div class="section-title"><h2 id="monitor-title">主流网站延迟监测</h2></div><div class="monitor-grid" id="sites"></div></section><footer><span>UPDATED <span id="updated">—</span></span><a href="https://cf.107211.xyz/" target="_blank" rel="noopener noreferrer">次元星域</a></footer></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),LIMIT=30,INTERVAL=1000,N=[['baidu','百度','www.baidu.com','国内'],['wechat','微信','weixin.qq.com','国内'],['bilibili','哔哩哔哩','www.bilibili.com','国内'],['bytedance','字节跳动','www.bytedance.com','国内'],['taobao','淘宝','www.taobao.com','国内'],['netease','网易云音乐','music.163.com','国内'],['jd','京东','www.jd.com','国内'],['cloudflare','Cloudflare','www.cloudflare.com','国际'],['google','Google','www.google.com','国际'],['github','GitHub','github.com','国际'],['jsdelivr','jsDelivr','cdn.jsdelivr.net','国际'],['youtube','YouTube','www.youtube.com','国际'],['x','X','x.com','国际'],['wikipedia','Wikipedia','www.wikipedia.org','国际']].map(([id,name,host,region])=>({id,name,host,region}));let trend=[],hist=Object.fromEntries(N.map(n=>[n.id,[]])),busy=false,metaBusy=false;const iconURLs=(id,h)=>['/api/icon/'+id,'https://icon.horse/icon/'+h,'https://icons.duckduckgo.com/ip3/'+h+'.ico','https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64'];function card(n){return `<article class="site"><div class="site-head"><span class="site-icon"><img data-id="${n.id}" data-host="${n.host}" alt="" loading="eager" referrerpolicy="no-referrer"><span class="fallback">${n.name[0]}</span></span><div class="site-info"><b class="site-name">${n.name}</b><span class="site-region">${n.region}</span></div></div><div class="site-host">${n.host}</div><div class="site-data"><div class="bars" id="bars-${n.id}"></div><span class="latency" id="lat-${n.id}">—</span></div></article>`}function bindIcons(){document.querySelectorAll('.site-icon img').forEach(img=>{const urls=iconURLs(img.dataset.id,img.dataset.host);let i=0;img.onerror=()=>{if(++i<urls.length)img.src=urls[i];else{img.hidden=true;img.nextElementSibling.style.display='grid'}};img.src=urls[0]})}function draw(){ $('sites').innerHTML=N.map(card).join('');bindIcons();N.forEach(drawBars)}function drawBars(n){const b=$('bars-'+n.id);if(!b)return;const d=hist[n.id],c=Math.max(5,Math.min(20,Math.floor((b.clientWidth+2)/5))),v=Array(Math.max(0,c-d.length)).fill(null).concat(d.slice(-c));while(b.children.length<c)b.appendChild(document.createElement('i'));while(b.children.length>c)b.lastElementChild.remove();[...b.children].forEach((e,i)=>{const x=v[i];e.style.height=x===null?'4px':x<0?'5px':Math.max(4,Math.min(15,4+Math.log10(x+1)*3))+'px';e.style.background=x===null?'#cbd3df':x<0?'#e45b5b':x<=100?'#16a477':x<=300?'#e7b43d':'#e45b5b';e.title=x===null?'等待':x<0?'超时':x+'ms'})}function display(el,v){if(!Number.isFinite(v)){el.textContent=v??'—';delete el.dataset.v;return}const s=String(Math.round(v));if(el.dataset.v===s)return;el.dataset.v=s;el.innerHTML='<span class="digits">'+s.split('').map(d=>'<span class="digit"><span class="digit-strip" style="transform:translateY(-'+d+'em)">'+Array.from({length:10},(_,i)=>'<b>'+i+'</b>').join('')+'</span></span>').join('')+'</span><span class="unit">ms</span>'}async function probe(n){const c=new AbortController(),t=setTimeout(()=>c.abort(),900),s=performance.now();try{await fetch('https://'+n.host+'/favicon.ico?_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:c.signal});return{id:n.id,ok:true,ms:Math.max(1,Math.round(performance.now()-s))}}catch{return{id:n.id,ok:false,ms:null}}finally{clearTimeout(t)}}function renderTrend(){const W=600,H=250,L=44,R=10,T=14,B=14,base=H-B,ph=base-T,pw=W-L-R,v=trend.slice(-LIMIT),ok=v.filter(Number.isFinite),target=Math.max(100,(ok.length?Math.max(...ok):0)*1.1),raw=target/2,mag=10**Math.floor(Math.log10(raw||1)),ratio=raw/mag,step=([1,1.5,2,2.5,5,10].find(x=>x>=ratio)||10)*mag,scale=Math.max(100,Math.ceil(target/step)*step),slot=pw/LIMIT,bw=slot*.9,off=LIMIT-v.length;let grid='';for(let x=step;x<=scale+1e-9;x+=step){const y=base-x/scale*ph;grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="rgba(111,126,148,.17)"/><text x="${L-8}" y="${y+3}" text-anchor="end" fill="#8b96a6" font-size="9">${x}</text>`}const guides=[100,300].map(x=>x<scale&&Math.abs(x/step-Math.round(x/step))>1e-8?`<line x1="${L}" y1="${base-x/scale*ph}" x2="${W-R}" y2="${base-x/scale*ph}" stroke="rgba(160,170,184,.35)" stroke-dasharray="3 4"/>`:'').join(''),bars=v.map((x,i)=>{const px=L+(off+i)*slot+(slot-bw)/2,valid=Number.isFinite(x),h=valid?Math.max(3,x/scale*ph):3,y=base-h,c=!valid?'#cbd3df':x<=100?'#16a477':x<=300?'#e7b43d':'#e45b5b';return `<rect x="${px.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(bw/2,h/2)}" fill="${c}"><title>${valid?x+'ms':'暂无数据'}</title></rect>`}).join('');$('history').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="网络延迟趋势图"><text x="4" y="12" fill="#8b96a6" font-size="9">ms</text>${grid}${guides}${bars}</svg>`}async function refresh(){if(busy||document.hidden)return;busy=true;try{const r=await Promise.all(N.map(probe)),ok=r.filter(x=>x.ok),avg=ok.length?Math.round(ok.reduce((s,x)=>s+x.ms,0)/ok.length):null;r.forEach(x=>{const e=$('lat-'+x.id);if(x.ok){display(e,x.ms);e.className='latency '+(x.ms<=100?'good':x.ms<=300?'warn':'bad')}else{e.textContent='超时';e.className='latency bad'}const h=hist[x.id];h.push(x.ok?x.ms:-1);if(h.length>20)h.shift();drawBars(N.find(n=>n.id===x.id))});display($('avg'),avg);trend.push(avg);if(trend.length>LIMIT)trend.shift();renderTrend();$('updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false})}finally{busy=false}}function isIP(v){const s=String(v||'').trim().replace(/^\[|\]$/g,'');if(/^(?:\d{1,3}\.){3}\d{1,3}$/.test(s))return s.split('.').every(x=>+x<=255);if(!s.includes(':'))return false;try{return new URL('http://['+s+']/').hostname.length>0}catch{return false}}function cleanField(v){if(v==null)return'';if(typeof v==='object')v=v.name||v.organization||v.value||v.code||v.asn||'';return String(v).trim().replace(/^[\s"'[{]+/,'').replace(/[\s"',;}\]]+$/,'').trim()}function flatten(o,out={},d=0){if(!o||typeof o!=='object'||d>6)return out;for(const[k,v]of Object.entries(o)){if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,out,d+1);else out[k]=v}return out}function parseInfo(body){let raw=String(body??'').trim(),obj={};try{const j=JSON.parse(raw);if(j&&typeof j==='object')obj=flatten(j);else if(typeof j==='string')raw=j}catch{}const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),idx=Object.fromEntries(Object.entries(obj).map(([k,v])=>[norm(k),v]));const keys={ip:['ip','client_ip','clientip','ip_address','ipaddress','ip_addr','address','query','remote_ip','remoteip','cf_connecting_ip','cfconnectingip','cf_ip'],country:['country_name','countryname','country','country_code','countrycode','cf_country','cfcountry','loc'],colo:['colo','cf_colo','cfcolo','cloudflare_colo','cloudflarecolo','datacenter','data_center','edge_location','edgelocation'],asn:['asn','as_number','asnumber','autonomous_system','autonomous_system_number'],isp:['isp','provider','internet_service_provider','internetserviceprovider','network_operator','networkoperator','network_provider','networkprovider','carrier','carrier_name','carriername','isp_name','ispname','connection_isp','connectionisp'],org:['asorganization','as_organization','asn_org','as_name','organization','org'],city:['city','city_name'],region:['region','region_name','province','state']};const out={};for(const[k,a]of Object.entries(keys)){const n=a.map(norm).find(x=>idx[x]!=null&&cleanField(idx[x])&&cleanField(idx[x])!=='-');if(n)out[k]=cleanField(idx[n]);}if(out.country&&/^[a-z]{2}$/i.test(out.country))out.country=out.country.toUpperCase();const text=raw.replace(/<[^>]*>/g,' ');if(!isIP(out.ip)){if(isIP(text))out.ip=text;else{const v4=text.match(/\b(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b/),v6=text.match(/(?:[0-9a-f]{1,4}:){2,7}[0-9a-f]{0,4}|::(?:[0-9a-f]{0,4}:){0,6}[0-9a-f]{0,4}/i);if(v4&&isIP(v4[0]))out.ip=v4[0];else if(v6&&isIP(v6[0]))out.ip=v6[0]}}for(const line of text.split(/[\r\n;,|]+/)){const m=line.match(/^\s*["']?([^:=：]+?)["']?\s*[:=：]\s*["']?(.+?)["']?\s*$/);if(!m)continue;const k=norm(m[1]),v=cleanField(m[2]),field=Object.keys(keys).find(f=>keys[f].map(norm).includes(k));if(field&&v)out[field]=v;if(k==='loc'&&/^[a-z]{2}$/i.test(v))out.country=v.toUpperCase()}return out;}async function fetchInfo(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),4500);try{const r=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',headers:{Accept:'application/json,text/plain,*/*'},signal:c.signal});return r.ok?parseInfo(await r.text()):{}}catch{return{}}finally{clearTimeout(t)}}function jsonpIP(){return new Promise(resolve=>{const cb='__domainIP'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch{window[cb]=undefined}s.remove();resolve(v&&typeof v==='object'?parseInfo(v):v?parseInfo(v):{})};window[cb]=v=>finish(v);s.onerror=()=>finish(null);s.src='https://api.ipify.org?format=jsonp&callback='+cb;const timer=setTimeout(()=>finish(null),4500);document.head.appendChild(s)})}function mergeInfo(...sources){const o={};for(const src of sources)for(const[k,v]of Object.entries(src||{})){const value=cleanField(v);if(!value||value==='-')continue;if(k==='ip'){if(!isIP(o.ip)&&isIP(value))o.ip=value}else if(!o[k])o[k]=value}return o}async function meta(){if(metaBusy||document.hidden)return;metaBusy=true;try{let d=mergeInfo(await fetchInfo('/api/meta?_='+Date.now()));if(!isIP(d.ip))d=mergeInfo(d,await fetchInfo('/cdn-cgi/trace?_='+Date.now()));if(!isIP(d.ip))d=mergeInfo(d,await fetchInfo('https://cf.107211.xyz/ip'));if(!isIP(d.ip))d=mergeInfo(d,await fetchInfo('https://ipwho.is/'));if(!isIP(d.ip))d=mergeInfo(d,await fetchInfo('https://api.ipify.org?format=json'));if(!isIP(d.ip))d=mergeInfo(d,await fetchInfo('https://api64.ipify.org?format=json'));if(!isIP(d.ip))d=mergeInfo(d,await jsonpIP());if(isIP(d.ip)&&(!d.org||!d.asn||!d.country||!d.isp))d=mergeInfo(d,await fetchInfo('https://ipwho.is/'+encodeURIComponent(d.ip)));$('ip').textContent=isIP(d.ip)?d.ip:'获取失败';$('country').textContent=cleanField(d.country)||'—';$('colo').textContent=cleanField(d.colo)||'未识别';$('asn').textContent=d.asn?(/^AS/i.test(String(d.asn))?cleanField(d.asn):'AS'+cleanField(d.asn)):'—';$('org').textContent=cleanField(d.org||d.asOrganization||d.isp||d.provider||d.network_operator)||'—';$('location').textContent=[cleanField(d.city),cleanField(d.region)].filter(Boolean).join(', ')||'—';$('ip').title=isIP(d.ip)?'':'IP 服务均未返回有效地址；请检查网络或接口可用性';}finally{metaBusy=false}}function wallpaper(){const x=matchMedia('(orientation: portrait)').matches?'mp':'ycy';document.documentElement.style.setProperty('--wallpaper',`url("https://t.alcy.cc/${x}?_=${Date.now()}")`)}$('host').textContent=location.host||'本地预览';draw();renderTrend();wallpaper();if(window.ResizeObserver){const o=new ResizeObserver(()=>N.forEach(drawBars));o.observe($('sites'))}else addEventListener('resize',()=>N.forEach(drawBars));refresh();meta();setInterval(refresh,INTERVAL);setInterval(meta,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();meta()}});addEventListener('orientationchange',wallpaper)})();</script></body></html>
